name: cng_protect
description: A native Android IoT app for CNG Protect.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- ICONS ---
  cupertino_icons: ^1.0.8

  # --- FIREBASE & IOT ---
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  firebase_database: ^11.1.0
  firebase_messaging: ^15.1.3

  # --- NOTIFICATIONS ---
  flutter_local_notifications: ^17.2.2

  # --- STATE MANAGEMENT ---
  provider: ^6.1.2

  # --- UI & CHARTS ---
  syncfusion_flutter_gauges: ^21.1.35
  fl_chart: ^0.66.2

  # --- LOCAL STORAGE ---
  sqflite: ^2.3.0
  path: ^1.9.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # --- ICON GENERATOR ---
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

# --- ICON CONFIGURATION (Corrected Name) ---
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon.png"